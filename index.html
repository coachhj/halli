<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>할리갈리 숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#fff6ec; --bg2:#ffe9d6; --ink:#5a4636; --ink-soft:#9a8572;
  --table:#9fd8a8; --table-edge:#7cc48a; --felt:#b6e3b9;
  --card:#ffffff; --card-edge:#f1dfcf;
  --pink:#ff8fab; --yellow:#ffc857; --mint:#6fd6c6; --red:#ff5d73;
  --back:#c9b8f0; --back-dot:#e6dcff;
  --shadow:0 6px 0 rgba(90,70,54,.12), 0 10px 24px rgba(90,70,54,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(circle at 20% 10%,#fff 0,var(--bg) 40%,var(--bg2) 100%);color:var(--ink);
  font-family:"Jua",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:0}
input{font-family:inherit}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}

/* ---------- home / lobby ---------- */
.panel{width:100%;max-width:400px;background:#fff;border-radius:28px;padding:22px 20px;box-shadow:var(--shadow);margin:auto 0;border:3px solid #fff1e2}
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:14px}
.logo .fruits{display:flex;gap:6px;margin-bottom:6px}
.logo .fruits svg{width:34px;height:34px;animation:bob 2.4s ease-in-out infinite}
.logo .fruits svg:nth-child(2){animation-delay:.3s}.logo .fruits svg:nth-child(3){animation-delay:.6s}.logo .fruits svg:nth-child(4){animation-delay:.9s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.logo h1{margin:0;font-size:40px;font-weight:400;color:var(--red);letter-spacing:1px;text-shadow:0 3px 0 #ffd6dd}
.logo p{margin:0;color:var(--ink-soft);font-size:15px}
label.f{display:block;font-size:14px;color:var(--ink-soft);margin:12px 4px 6px}
.inp{width:100%;font-size:20px;padding:12px 16px;border-radius:16px;border:3px solid #f3e3d3;background:#fffaf5;color:var(--ink);outline:none}
.inp:focus{border-color:var(--pink)}
.inp.code{letter-spacing:6px;text-align:center}
.btn{display:block;width:100%;font-size:20px;padding:14px;border-radius:18px;color:#fff;background:var(--pink);box-shadow:0 5px 0 #e0688a;margin-top:12px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #e0688a}
.btn.y{background:var(--yellow);box-shadow:0 5px 0 #e0a83a;color:#6b4a12}
.btn.y:active{box-shadow:0 2px 0 #e0a83a}
.btn.m{background:var(--mint);box-shadow:0 5px 0 #46b3a3}
.btn.m:active{box-shadow:0 2px 0 #46b3a3}
.btn.ghost{background:#f6ece2;color:var(--ink);box-shadow:0 5px 0 #e6d6c6}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.or{text-align:center;color:var(--ink-soft);margin:14px 0 0;font-size:14px}
.msg{min-height:20px;text-align:center;color:var(--red);font-size:15px;margin-top:10px}

.code-big{text-align:center;margin:4px 0 8px}
.code-big .lbl{color:var(--ink-soft);font-size:14px}
.code-big .c{font-size:46px;letter-spacing:10px;color:var(--ink);line-height:1.1}
.share{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:6px}
.share .qr{width:110px;height:110px;background:#fff;border-radius:12px;border:3px solid #f3e3d3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.share .qr svg{width:100%;height:100%}
.share .sb{display:flex;flex-direction:column;gap:8px}
.chip{font-size:15px;padding:9px 14px;border-radius:14px;background:#f6ece2;color:var(--ink)}
.plist{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plist li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:16px;background:#fffaf5;border:2px solid #f3e3d3;font-size:16px;min-width:0}
.plist li .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.plist li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist li .x{margin-left:auto;background:none;color:var(--ink-soft);font-size:18px;padding:0 4px}
.plist li.empty{border-style:dashed;color:#cdbcad;justify-content:center}
.hint{font-size:13px;color:var(--ink-soft);text-align:center;margin-top:10px;line-height:1.4}

/* ---------- game ---------- */
#game{padding-left:8px;padding-right:8px}
.top{width:100%;max-width:560px;display:flex;align-items:center;gap:8px;height:44px;flex:none}
.top .room{font-size:15px;padding:6px 12px;border-radius:12px;background:#fff;box-shadow:0 3px 0 rgba(90,70,54,.1)}
.top .timer{margin-left:auto;font-size:24px;padding:4px 14px;border-radius:14px;background:#fff;box-shadow:0 3px 0 rgba(90,70,54,.1);min-width:86px;text-align:center}
.top .timer.hurry{color:#fff;background:var(--red);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.top .snd{width:40px;height:40px;border-radius:12px;background:#fff;font-size:20px;box-shadow:0 3px 0 rgba(90,70,54,.1)}
.arena-wrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.arena{position:relative;width:var(--S);height:var(--S)}
.tablebg{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--felt) 0,var(--table) 70%);border:6px solid var(--table-edge);box-shadow:inset 0 6px 0 rgba(255,255,255,.35),0 8px 0 rgba(90,70,54,.12)}
.tablebg::after{content:"";position:absolute;inset:10%;border-radius:50%;border:3px dashed rgba(255,255,255,.55)}
.seat{position:absolute;width:calc(var(--S)*.15);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:3}
.seat .av{position:relative;width:calc(var(--S)*.125);height:calc(var(--S)*.125);border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:calc(var(--S)*.07);border:3px solid #fff;box-shadow:0 3px 0 rgba(90,70,54,.15);transition:transform .2s}
.seat .nm{font-size:calc(var(--S)*.036);max-width:calc(var(--S)*.19);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;padding:1px 7px;border-radius:9px;margin-top:-6px;box-shadow:0 2px 0 rgba(90,70,54,.1);position:relative;z-index:1}
.seat .cnt{position:absolute;right:-8px;top:-6px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:#fff;color:var(--ink);font-size:14px;line-height:24px;text-align:center;border:2px solid var(--c);transition:transform .2s}
.seat.turn .av{animation:turnGlow 1s ease-in-out infinite;transform:scale(1.12)}
@keyframes turnGlow{0%,100%{box-shadow:0 0 0 0 var(--c)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 45%,transparent)}}
.seat.off .av{filter:grayscale(1);opacity:.6}
.seat .crown,.mydeck .crown{position:absolute;top:-58%;left:50%;transform:translateX(-50%);font-size:calc(var(--S)*.08);animation:bob 1.6s infinite}
.pile{position:absolute;width:calc(var(--S)*.145);height:calc(var(--S)*.203);transform:translate(-50%,-50%) rotate(var(--r));z-index:2}
.pile .slot{position:absolute;inset:0;border-radius:12%;border:2px dashed rgba(255,255,255,.7)}
.pile .stack{position:absolute;inset:0;border-radius:12%;background:#fff;transform:translate(3px,3px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.pile svg.card{position:absolute;inset:0;width:100%;height:100%}
.cardsvg{display:block;filter:drop-shadow(0 2px 0 rgba(90,70,54,.18))}
.bell{position:absolute;left:50%;top:50%;width:calc(var(--S)*.24);height:calc(var(--S)*.24);transform:translate(-50%,-50%);background:none;padding:0;z-index:4;border-radius:50%}
.bell svg{width:100%;height:100%;display:block;overflow:visible}
.bell.ring svg{animation:ring .45s ease}
@keyframes ring{0%{transform:scale(.92)}20%{transform:rotate(-14deg) scale(1.04)}45%{transform:rotate(11deg)}70%{transform:rotate(-6deg)}100%{transform:none}}
.bell:disabled{opacity:1}
.pot{position:absolute;left:50%;top:calc(50% + var(--S)*.1);transform:translate(-50%,0);background:#fff;border-radius:10px;font-size:13px;padding:1px 8px;z-index:5;box-shadow:0 2px 0 rgba(90,70,54,.12);white-space:nowrap}
.bottom{width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;gap:14px;flex:none;padding:6px 0 4px;min-height:150px}
.me-info{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px}
.me-info .av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #fff;box-shadow:0 3px 0 rgba(90,70,54,.15)}
.me-info .nm{font-size:16px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mydeck{position:relative;width:96px;height:134px;border-radius:16px;background:none;padding:0;transition:transform .15s}
.mydeck .back{position:absolute;inset:0;border-radius:16px;background-color:var(--back);background-image:radial-gradient(var(--back-dot) 18%,transparent 20%),radial-gradient(var(--back-dot) 18%,transparent 20%);background-size:18px 18px;background-position:0 0,9px 9px;border:5px solid #fff;box-shadow:0 5px 0 rgba(90,70,54,.18);transition:background-color .25s}
.mydeck .back.b2{transform:translate(4px,4px);opacity:.8;box-shadow:none}
.mydeck .back.b3{transform:translate(8px,8px);opacity:.6;box-shadow:none}
.mydeck .num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18);z-index:2}
.mydeck.empty .back{background:none;border:3px dashed #d9c7b6;box-shadow:none}
.mydeck.empty .b2,.mydeck.empty .b3{display:none}
.mydeck.empty .num{white-space:pre-line;color:#c4b1a0;text-shadow:none;font-size:15px;width:90%;text-align:center;line-height:1.3}
.mydeck.myturn{animation:hop .7s ease-in-out infinite}
.mydeck.myturn .back{background-color:var(--myc);box-shadow:0 5px 0 rgba(90,70,54,.18),0 0 0 6px color-mix(in srgb,var(--myc) 35%,transparent)}
@keyframes hop{50%{transform:translateY(-7px) rotate(-2deg)}}
.tbar{width:96px;height:8px;border-radius:4px;background:#f1e3d4;overflow:hidden;margin-top:8px}
.tbar i{display:block;height:100%;width:100%;background:var(--myc);transform-origin:left}
.side{display:flex;flex-direction:column;align-items:center}
.speech{min-height:26px;font-size:16px;color:var(--ink);background:#fff;padding:3px 12px;border-radius:12px;box-shadow:0 2px 0 rgba(90,70,54,.1)}
.speech.hide{visibility:hidden}

.fly{position:fixed;left:0;top:0;z-index:50;pointer-events:none;will-change:transform}
.fly .bk{width:100%;height:100%;border-radius:12%;background-color:var(--back);background-image:radial-gradient(var(--back-dot) 18%,transparent 20%);background-size:10px 10px;border:3px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,.15)}
.float{position:fixed;z-index:60;pointer-events:none;font-size:26px;transform:translate(-50%,-50%);text-shadow:0 2px 0 #fff,0 0 6px #fff;animation:floatUp 1s ease-out forwards}
.float.minus{color:var(--red)}.float.plus{color:#2fa35a}
@keyframes floatUp{to{transform:translate(-50%,-160%);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-size:17px;z-index:80;transition:opacity .3s;max-width:90vw;text-align:center}

.overlay{position:fixed;inset:0;background:rgba(90,70,54,.35);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.endcard{width:100%;max-width:380px;background:#fff;border-radius:28px;padding:22px 20px;box-shadow:var(--shadow);text-align:center;animation:popIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}}
.endcard .trophy{font-size:64px;line-height:1;animation:bob 1.6s infinite}
.endcard h2{margin:6px 0 2px;font-weight:400;font-size:30px;color:var(--red)}
.endcard .champ{font-size:22px;margin-bottom:12px}
.rank{list-style:none;padding:0;margin:0 0 6px;text-align:left;max-height:40vh;overflow:auto}
.rank li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;font-size:17px}
.rank li.w{background:#fff3c4}
.rank li .r{width:24px;text-align:center;color:var(--ink-soft)}
.rank li .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.rank li .n{margin-left:auto}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:95;pointer-events:none;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.howto{font-size:14px;color:var(--ink-soft);line-height:1.55;text-align:left;background:#fffaf5;border-radius:14px;padding:10px 12px;margin-top:12px}
.howto b{color:var(--ink);font-weight:400}
</style>
</head>
<body>

<!-- fruit + bell symbols -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="f-s" viewBox="0 0 24 24">
      <path d="M12 22.5C6.5 19 3.2 14 4 9.6 4.6 6.6 7.6 5.4 12 7c4.4-1.6 7.4-.4 8 2.6.8 4.4-2.5 9.4-8 12.9Z" fill="#ff5d73" stroke="#e23e57" stroke-width=".8"/>
      <g fill="#fff3b0"><ellipse cx="8.5" cy="11" rx=".7" ry="1"/><ellipse cx="12" cy="10.5" rx=".7" ry="1"/><ellipse cx="15.5" cy="11" rx=".7" ry="1"/><ellipse cx="10" cy="14.5" rx=".7" ry="1"/><ellipse cx="14" cy="14.5" rx=".7" ry="1"/><ellipse cx="12" cy="18" rx=".7" ry="1"/></g>
      <path d="M12 8.2 8 5.4l2.6.2L9.4 2.8l2.6 2 2.6-2-1.2 2.8 2.6-.2Z" fill="#4fbf62" stroke="#38a04b" stroke-width=".6" stroke-linejoin="round"/>

      <circle cx="12" cy="12.6" r="1.1" fill="#fff"/>
    </symbol>
    <symbol id="f-p" viewBox="0 0 24 24">
      <path d="M12 6.4c5.4-.6 8.6 3 8.4 7.6-.2 4.6-3.8 8-8.4 8s-8.2-3.4-8.4-8C3.4 9.4 6.6 5.8 12 6.4Z" fill="#a66cf0" stroke="#7d45cc" stroke-width=".9"/>
      <path d="M12 7.2c-.8 3-.8 9 0 14" fill="none" stroke="#8c55db" stroke-width=".9"/>

  </defs>
</svg>

<!-- HOME -->
<section id="home" class="screen">
  <div class="panel">
    <div class="logo">
      <div class="fruits">
        <svg viewBox="0 0 24 24"><use href="#f-s"/></svg><svg viewBox="0 0 24 24"><use href="#f-b"/></svg><svg viewBox="0 0 24 24"><use href="#f-l"/></svg><svg viewBox="0 0 24 24"><use href="#f-p"/></svg>
      </div>
      <h1>할리갈리</h1>
      <p>같은 과일이 딱 다섯 개면 땡!</p>
    </div>
    <label class="f" for="nameIn">내 이름</label>
    <input id="nameIn" class="inp" maxlength="8" placeholder="예: 한주" autocomplete="off">
    <div id="joinBox">
      <label class="f" for="codeIn">방 코드로 입장</label>
      <div class="row">
        <input id="codeIn" class="inp code" maxlength="4" placeholder="1234" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <button id="joinBtn" class="btn m" style="margin-top:0;flex:.7">입장</button>
      </div>
    </div>
    <div class="or">또는</div>
    <button id="createBtn" class="btn">새 방 만들기</button>
    <button id="soloBtn" class="btn y">AI랑 연습하기</button>
    <div id="homeMsg" class="msg"></div>
    <div class="howto">
      <b>놀이 방법</b> · 차례가 되면 내 카드 더미를 톡! 테이블 위 보이는 과일 중 <b>같은 과일이 정확히 5개</b>면 가운데 벨을 누르세요. 가장 빨리 누른 사람이 깔린 카드를 모두 가져가요. 틀리면 내 카드 1장이 바닥으로! <b>5분 뒤 카드가 가장 많은 사람이 챔피언</b>.
    </div>
  </div>
</section>

<!-- LOBBY -->
<section id="lobby" class="screen hidden">
  <div class="panel">
    <div class="code-big"><div class="lbl">방 코드</div><div class="c" id="lobbyCode">----</div></div>
    <div class="share" id="shareBox">
      <div class="qr" id="qr"></div>
      <div class="sb">
        <button class="chip" id="copyBtn">🔗 링크 복사</button>
        <button class="chip" id="shareBtn">📤 공유하기</button>
      </div>
    </div>
    <ul class="plist" id="plist"></ul>
    <div id="hostCtl">
      <div class="row">
        <button id="addBotBtn" class="btn ghost">🤖 AI 팀원 추가</button>
      </div>
      <button id="startBtn" class="btn">게임 시작!</button>
    </div>
    <div id="waitMsg" class="hint">방장이 시작하기를 기다리는 중…</div>
    <div class="hint" id="hostHint">방장은 게임 내내 이 화면을 켜 두세요. 방장 화면이 꺼지면 게임이 멈춰요.</div>
    <div class="msg" id="lobbyMsg"></div>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen hidden">
  <div class="top">
    <div class="room" id="gRoom">방 ----</div>
    <button class="snd" id="sndBtn" aria-label="소리">🔊</button>
    <div class="timer" id="timer">5:00</div>
  </div>
  <div class="arena-wrap" id="arenaWrap">
    <div class="arena" id="arena">
      <div class="tablebg"></div>
      <div id="piles"></div>
      <div id="seats"></div>
      <button class="bell" id="bell" aria-label="벨">
        <svg viewBox="0 0 100 100">
          <ellipse cx="50" cy="86" rx="40" ry="9" fill="rgba(60,90,60,.25)"/>
          <ellipse cx="50" cy="80" rx="38" ry="10" fill="#d99a1e"/>
          <rect x="12" y="72" width="76" height="8" fill="#d99a1e"/>
          <ellipse cx="50" cy="72" rx="38" ry="10" fill="#ffcf4a"/>
          <path d="M18 72C18 44 32 30 50 30s32 14 32 42Z" fill="#ffd95c" stroke="#e6a92a" stroke-width="2.5"/>
          <path d="M28 60c0-14 8-22 18-24" fill="none" stroke="#fff6c8" stroke-width="5" stroke-linecap="round"/>
          <rect x="44" y="18" width="12" height="14" rx="4" fill="#ff8fab" stroke="#e0688a" stroke-width="2"/>
          <ellipse cx="50" cy="18" rx="9" ry="4" fill="#ffb3c6"/>
          <g fill="#7a4b12"><circle cx="40" cy="56" r="2.6"/><circle cx="60" cy="56" r="2.6"/></g>
          <path d="M45 62q5 4 10 0" fill="none" stroke="#7a4b12" stroke-width="2" stroke-linecap="round"/>
          <g fill="#ff9fb3" opacity=".7"><ellipse cx="34" cy="61" rx="4" ry="2.4"/><ellipse cx="66" cy="61" rx="4" ry="2.4"/></g>
        </svg>
      </button>
      <div class="pot hidden" id="pot">바닥 0</div>
    </div>
  </div>
  <div class="bottom">
    <div class="me-info">
      <div class="av" id="meAv">🐰</div>
      <div class="nm" id="meNm">나</div>
    </div>
    <div class="side">
      <button class="mydeck" id="mydeck" aria-label="내 카드 내기">
        <div class="back b3"></div><div class="back b2"></div><div class="back"></div>
        <div class="num" id="myNum">0</div>
      </button>
      <div class="tbar" id="tbar"><i id="tbarI"></i></div>
    </div>
    <div class="me-info">
      <div class="speech hide" id="speech">내 차례!</div>
    </div>
  </div>
</section>

<div id="overlay" class="overlay hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";
/* =========================================================
   공통 설정
   ========================================================= */
const PREFIX = 'hg-forest-v1-';
const TURN_MS = 8000;
const MAX_SEATS = 8, MAX_BOTS = 2;
const BELL_WINDOW = 220;
const AVATARS = ['🐰','🐻','🐱','🐶','🦊','🐼','🐨','🐯','🐹','🐸'];
const COLORS = ['#ff8fab','#7fc8f8','#ffc857','#9bd77c','#c3a6ff','#ff9f6b','#6fd6c6','#f48fb1'];
const BOT_NAMES = ['AI 콩이','AI 팥이'];
const FRUITS = ['s','b','l','p'];
const qs = new URLSearchParams(location.search);
const GAME_MS = (+qs.get('gamesec') || 300) * 1000; // 테스트용 ?gamesec=30
const $ = id => document.getElementById(id);

function peerOpts(){
  // 테스트용: ?peerhost=localhost&peerport=9000 으로 자체 서버 사용 가능
  const o = { debug: 0, config: { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' } ] } };
  if (qs.get('peerhost')) {
    o.host = qs.get('peerhost'); o.port = +(qs.get('peerport') || 9000);
    o.path = qs.get('peerpath') || '/'; o.secure = qs.get('secure') === '1';
  }
  return o;
}
function cid(){
  let v; try { v = localStorage.getItem('hg-cid'); } catch(e){}
  if (!v) { v = Math.random().toString(36).slice(2) + Date.now().toString(36); try{localStorage.setItem('hg-cid', v);}catch(e){} }
  return v;
}
const MY_CID = cid() + (qs.get('tab') || '');
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function rand(a,b){ return a + Math.random()*(b-a); }
function newCode(){ let s=''; for(let i=0;i<4;i++) s+=Math.random()*10|0; return s; }

/* =========================================================
   HOST 엔진 (방장 기기에서만 실행되는 심판)
   ========================================================= */
const H = {
  S: null, conns: new Map(), peer: null, timers: {}, botTimers: {},
  validAt: {}, penal: new Set(), cands: [], seq: 0,
};
function hostInit(code){
  H.S = { phase:'lobby', code, seats:[], turn:-1, ver:0, collectVer:0, pot:[], endsAt:0, turnDeadline:0, winners:[], lock:false };
}
function makeSeat(name, bot, ccid){
  const used = new Set(H.S.seats.map(s=>s.color));
  const color = COLORS.find(c=>!used.has(c)) || COLORS[0];
  const usedA = new Set(H.S.seats.map(s=>s.avatar));
  const avatar = bot ? '🤖' : (AVATARS.find(a=>!usedA.has(a)) || '🐰');
  return { id: 'p' + (++H.seq), name, bot, cid: ccid, conn: true, color, avatar, deck: [], pile: [] };
}
function pubState(){
  const S = H.S;
  return {
    phase:S.phase, code:S.code, ver:S.ver, collectVer:S.collectVer, potN:S.pot.length,
    endsAt:S.endsAt, turnDeadline:S.turnDeadline, winners:S.winners, hostSeat:S.hostSeat,
    turn: S.turn >= 0 && S.seats[S.turn] ? S.seats[S.turn].id : null,
    seats: S.seats.map(s=>({ id:s.id, name:s.name, avatar:s.avatar, color:s.color, bot:s.bot, conn:s.conn,
      deckN:s.deck.length, pileN:s.pile.length, top: s.pile.length ? s.pile[s.pile.length-1] : null }))
  };
}
function broadcast(ev){
  const msg = { t:'state', s:pubState(), ev: ev || null, now: Date.now() };
  for (const conn of H.conns.values()) { try { if (conn.open) conn.send(msg); } catch(e){} }
  setTimeout(()=>onHostMsg(msg), 0);
}
function seatIdx(id){ return H.S.seats.findIndex(s=>s.id===id); }
function tableValid(){
  const cnt = {s:0,b:0,l:0,p:0};
  for (const s of H.S.seats) if (s.pile.length){ const c=s.pile[s.pile.length-1]; cnt[c.f]+=c.n; }
  return FRUITS.some(f=>cnt[f]===5);
}
function tableNearMiss(){
  const cnt = {s:0,b:0,l:0,p:0};
  for (const s of H.S.seats) if (s.pile.length){ const c=s.pile[s.pile.length-1]; cnt[c.f]+=c.n; }
  return FRUITS.some(f=>cnt[f]===4||cnt[f]===6);
}
function clearT(k){ if(H.timers[k]){ clearTimeout(H.timers[k]); H.timers[k]=null; } }

/* --- 로비 --- */
function hostJoin(conn, name, ccid){
  const S = H.S;
  name = String(name||'').trim().slice(0,8) || '친구';
  let seat = S.seats.find(s=>!s.bot && s.cid===ccid);
  if (seat){
    seat.conn = true; seat.name = name;
    if (conn) { H.conns.set(seat.id, conn); conn.seatId = seat.id; conn.send({t:'welcome', seat:seat.id}); }
    broadcast(); return seat;
  }
  if (S.phase !== 'lobby'){ conn && conn.send({t:'err', msg:'게임이 이미 진행 중이에요. 다음 판에 함께해요!'}); return null; }
  if (S.seats.length >= MAX_SEATS){ conn && conn.send({t:'err', msg:'자리가 꽉 찼어요 (최대 8명)'}); return null; }
  seat = makeSeat(name, false, ccid);
  S.seats.push(seat);
  if (conn){ H.conns.set(seat.id, conn); conn.seatId = seat.id; conn.send({t:'welcome', seat:seat.id}); }
  broadcast(); return seat;
}
function hostAddBot(){
  const S = H.S; if (S.phase!=='lobby') return;
  const bots = S.seats.filter(s=>s.bot);
  if (bots.length >= MAX_BOTS || S.seats.length >= MAX_SEATS) return;
  const nm = BOT_NAMES.find(n=>!bots.some(b=>b.name===n)) || 'AI';
  S.seats.push(makeSeat(nm, true, null)); broadcast();
}
function hostRemove(id){
  const S = H.S; if (S.phase!=='lobby' || id===S.hostSeat) return;
  const i = seatIdx(id); if (i<0) return;
  const s = S.seats[i];
  if (!s.bot){ const c = H.conns.get(id); if (c){ try{c.send({t:'err', msg:'방장이 자리를 정리했어요.'});}catch(e){} H.conns.delete(id); } }
  S.seats.splice(i,1); broadcast();
}
function hostLeft(id){
  const S = H.S, i = seatIdx(id); if (i<0) return;
  H.conns.delete(id);
  if (S.phase==='lobby'){ S.seats.splice(i,1); }
  else { S.seats[i].conn = false; if (S.turn===i) scheduleTurn(); }
  broadcast();
}

/* --- 게임 진행 --- */
function hostStart(){
  const S = H.S; if (S.phase==='play' || S.seats.length < 2) return;
  const deck = [];
  const dist = [1,1,1,1,1,2,2,2,3,3,3,4,4,5];
  let k = 0;
  for (const f of FRUITS) for (const n of dist) deck.push({ f, n, id: ++k });
  shuffle(deck);
  for (const s of S.seats){ s.deck = []; s.pile = []; }
  const per = Math.floor(deck.length / S.seats.length);
  S.seats.forEach((s,i)=>{ s.deck = deck.slice(i*per, (i+1)*per); });
  S.pot = deck.slice(per * S.seats.length);
  S.phase = 'play'; S.winners = []; S.ver = 1; S.collectVer = 1; S.lock = false;
  H.validAt = { 1:false }; H.penal.clear(); H.cands = [];
  S.turn = Math.random()*S.seats.length|0;
  S.endsAt = Date.now() + GAME_MS + 1500;
  clearT('game'); H.timers.game = setTimeout(()=>hostEnd('time'), GAME_MS + 1500);
  broadcast({ type:'deal' });
  setTimeout(()=>scheduleTurn(), 1500);
}
function nextTurn(from){
  const n = H.S.seats.length;
  for (let k=1;k<=n;k++){ const i=(from+k)%n; if (H.S.seats[i].deck.length) return i; }
  return -1;
}
function scheduleTurn(){
  const S = H.S; clearT('turn');
  if (S.phase!=='play') return;
  if (S.turn < 0 || !S.seats[S.turn] || !S.seats[S.turn].deck.length){
    S.turn = nextTurn(S.turn < 0 ? 0 : S.turn);
  }
  if (S.turn < 0){ // 아무도 낼 카드가 없음
    S.turnDeadline = 0;
    H.timers.turn = setTimeout(()=>{ if (H.S.phase==='play' && nextTurn(0) < 0 && !H.S.lock) hostEnd('stuck'); }, 4000);
    return;
  }
  const seat = S.seats[S.turn];
  const wait = seat.bot ? rand(1400,2600) : (seat.conn ? TURN_MS : 1500);
  S.turnDeadline = seat.bot ? 0 : Date.now() + wait;
  const turnAt = S.turn, verAt = S.ver;
  H.timers.turn = setTimeout(()=>{
    if (H.S.turn===turnAt && H.S.ver===verAt) hostFlip(H.S.seats[turnAt].id, true);
  }, wait);
}
function hostFlip(id, auto){
  const S = H.S, i = seatIdx(id);
  if (S.phase!=='play' || i<0 || S.turn!==i) return;
  if (S.lock){ // 벨 판정 중이면 잠깐 뒤 다시
    if (auto){ clearT('turn'); H.timers.turn = setTimeout(()=>hostFlip(id, true), 300); }
    return;
  }
  const s = S.seats[i]; if (!s.deck.length) return;
  const card = s.deck.pop(); s.pile.push(card);
  S.ver++; H.validAt[S.ver] = tableValid();
  S.turn = nextTurn(i);
  scheduleTurn();
  broadcast({ type:'flip', seat:id, card, auto: !!auto });
  botsReact();
}
function hostBell(id, v, rt){
  const S = H.S, i = seatIdx(id);
  if (S.phase!=='play' || i<0) return;
  v = +v; rt = Math.max(0, Math.min(10000, +rt || 0));
  if (!(v in H.validAt) || v < S.collectVer || v > S.ver) return; // 이미 정리된 판에 누른 것
  const s = S.seats[i];
  if (H.validAt[v]){
    if (H.cands.some(c=>c.id===id)) return;
    H.cands.push({ id, rt, at: Date.now() });
    if (!S.lock){ S.lock = true; clearT('bell'); H.timers.bell = setTimeout(resolveBell, BELL_WINDOW); }
    return;
  }
  if (S.lock) return; // 판정 중 늦게 누른 건 무시
  const key = id + ':' + v;
  if (H.penal.has(key)) return;
  H.penal.add(key);
  let lost = 0;
  if (s.deck.length){ S.pot.push(s.deck.shift()); lost = 1; }
  if (S.turn===i && !s.deck.length){ S.turn = nextTurn(i); scheduleTurn(); }
  broadcast({ type:'mistake', seat:id, lost });
}
function resolveBell(){
  const S = H.S; if (S.phase!=='play'){ S.lock=false; return; }
  const c = H.cands.slice().sort((a,b)=>a.rt-b.rt || a.at-b.at)[0];
  H.cands = [];
  const wi = seatIdx(c.id); const w = S.seats[wi];
  const from = []; let got = [];
  for (const s of S.seats){ if (s.pile.length){ from.push(s.id); got = got.concat(s.pile); s.pile = []; } }
  const potN = S.pot.length; got = got.concat(S.pot); S.pot = [];
  w.deck.unshift(...shuffle(got));
  S.ver++; S.collectVer = S.ver; H.validAt = { [S.ver]: false }; H.penal.clear();
  S.lock = false;
  S.turn = w.deck.length ? wi : nextTurn(wi);
  scheduleTurn();
  broadcast({ type:'collect', seat:w.id, from, potN, n: got.length, rt: Math.round(c.rt) });
  if (w.deck.length === 56) setTimeout(()=>hostEnd('all'), 1200); // 한 사람이 카드를 모두 가짐
}
function botsReact(){
  const S = H.S;
  for (const k in H.botTimers) clearTimeout(H.botTimers[k]);
  H.botTimers = {};
  if (S.phase!=='play') return;
  const v = S.ver, valid = H.validAt[v], near = !valid && tableNearMiss();
  for (const s of S.seats){
    if (!s.bot) continue;
    let rt = null;
    if (valid) rt = rand(2700, 3300);          // AI 벨: 약 3초, 조금씩 다르게
    else if (near && Math.random() < 0.06) rt = rand(2500, 3300); // 가끔 실수
    if (rt===null) continue;
    H.botTimers[s.id] = setTimeout(()=>hostBell(s.id, v, rt), rt);
  }
}
function hostEnd(why){
  const S = H.S; if (S.phase!=='play') return;
  clearT('turn'); clearT('game'); clearT('bell');
  for (const k in H.botTimers) clearTimeout(H.botTimers[k]);
  S.phase = 'end'; S.lock = false; S.turnDeadline = 0;
  const max = Math.max(...S.seats.map(s=>s.deck.length));
  S.winners = S.seats.filter(s=>s.deck.length===max).map(s=>s.id);
  broadcast({ type:'end', why });
}
function hostAgain(){
  const S = H.S; if (S.phase!=='end') return;
  S.seats = S.seats.filter(s=>s.bot || s.conn);
  for (const s of S.seats){ s.deck=[]; s.pile=[]; }
  S.pot = []; S.phase='lobby'; S.winners=[]; S.turn=-1; S.endsAt=0;
  broadcast({ type:'lobby' });
}
function hostHandle(seatId, m){
  if (!seatId || !m) return;
  if (m.t==='flip') hostFlip(seatId, false);
  else if (m.t==='bell') hostBell(seatId, m.v, m.rt);
}

/* --- 방 열기 (네트워크) --- */
function openRoom(name, solo){
  hostInit('----');
  const startLocal = (code)=>{
    H.S.code = code;
    const seat = hostJoin(null, name, MY_CID);
    H.S.hostSeat = seat.id;
    C.isHost = true; C.me = seat.id; C.solo = !!solo;
    if (solo){ hostAddBot(); hostAddBot(); }
    broadcast();
  };
  if (solo || typeof Peer === 'undefined'){
    if (!solo){ $('homeMsg').textContent = '연결 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
    startLocal('연습'); return;
  }
  $('homeMsg').textContent = '방을 만드는 중…';
  let tries = 0;
  const attempt = ()=>{
    const code = newCode();
    const peer = new Peer(PREFIX + code, peerOpts());
    peer.on('open', ()=>{ H.peer = peer; $('homeMsg').textContent=''; startLocal(code); history.replaceState(null,'', '?room=' + code + keepParams()); });
    peer.on('error', (e)=>{
      if (e.type==='unavailable-id' && tries++ < 5){ peer.destroy(); attempt(); return; }
      if (!H.peer){ $('homeMsg').textContent = '방을 만들지 못했어요 (' + e.type + '). 잠시 후 다시 시도해 주세요.'; }
    });
    peer.on('disconnected', ()=>{ try{ peer.reconnect(); }catch(e){} });
    peer.on('connection', (conn)=>{
      conn.on('data', (m)=>{
        if (!m || typeof m!=='object') return;
        if (m.t==='join') hostJoin(conn, m.name, String(m.cid||''));
        else if (m.t==='ping') conn.send({t:'pong', now:Date.now()});
        else hostHandle(conn.seatId, m);
      });
      conn.on('close', ()=>{ if (conn.seatId && H.conns.get(conn.seatId)===conn) hostLeft(conn.seatId); });
      conn.on('error', ()=>{});
    });
  };
  attempt();
}
function keepParams(){
  let s=''; for (const k of ['peerhost','peerport','peerpath','secure']) if (qs.get(k)) s += '&'+k+'='+encodeURIComponent(qs.get(k));
  return s;
}

/* =========================================================
   CLIENT (모든 참가자 화면)
   ========================================================= */
const C = { isHost:false, solo:false, me:null, conn:null, peer:null, view:null, lastVer:-1, shownAt:performance.now(),
  queue:[], busy:false, offset:0, bellCool:0, sound:true, ended:false };

function sendHost(m){
  if (C.isHost) hostHandle(C.me, m);
  else if (C.conn && C.conn.open) C.conn.send(m);
}
function joinRoom(name, code){
  if (typeof Peer === 'undefined'){ $('homeMsg').textContent = '연결 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
  $('homeMsg').textContent = '방에 들어가는 중…';
  const peer = new Peer(peerOpts()); C.peer = peer;
  let joined = false;
  const fail = (t)=>{ if (!joined) $('homeMsg').textContent = t; };
  const to = setTimeout(()=>fail('연결이 오래 걸려요. 방 코드를 확인하거나 와이파이/데이터를 바꿔 보세요.'), 12000);
  peer.on('open', ()=>{
    const conn = peer.connect(PREFIX + code, { reliable:true });
    C.conn = conn;
    conn.on('open', ()=>{ conn.send({ t:'join', name, cid:MY_CID }); });
    conn.on('data', (m)=>{
      if (!m) return;
      if (m.t==='welcome'){ joined = true; clearTimeout(to); C.me = m.seat; $('homeMsg').textContent=''; history.replaceState(null,'','?room='+code+keepParams()); }
      else if (m.t==='err'){ fail(m.msg); toast(m.msg); }
      else onHostMsg(m);
    });
    conn.on('close', ()=>{ if (joined) showGone(); });
  });
  peer.on('error', (e)=>{
    if (e.type==='peer-unavailable') fail('그 코드의 방을 찾을 수 없어요.');
    else fail('연결에 문제가 생겼어요 (' + e.type + ').');
  });
}
function showGone(){
  if (C.view && C.view.phase==='end') return;
  overlay(`<div class="endcard"><div class="trophy">🙈</div><h2>연결이 끊겼어요</h2>
    <p style="color:var(--ink-soft)">방장 화면이 꺼졌거나 인터넷이 끊겼어요.</p>
    <button class="btn" onclick="location.reload()">다시 입장하기</button></div>`);
}

function onHostMsg(m){
  if (m.t!=='state') return;
  C.offset = m.now - Date.now();
  C.queue.push(m); pump();
}
async function pump(){
  if (C.busy) return; C.busy = true;
  while (C.queue.length){
    const m = C.queue.shift();
    const skip = C.queue.length > 3 || document.hidden;
    if (m.ev && C.view && !skip){ try { await animate(m.ev, m.s); } catch(e){} }
    apply(m.s, m.ev);
  }
  C.busy = false;
}
function apply(s, ev){
  const prev = C.view; C.view = s;
  if (s.phase==='lobby'){ show('lobby'); renderLobby(s); C.ended=false; if (ev && ev.type==='lobby') hideToast(); return; }
  if (s.phase==='play' || s.phase==='end'){
    if (!prev || prev.phase==='lobby'){ show('game'); hideOverlay(); requestWake(); }
    if (s.ver !== C.lastVer){ C.lastVer = s.ver; C.shownAt = performance.now(); }
    renderGame(s);
    if (ev && ev.type==='end') showEnd(s);
  }
}

/* --- 화면 전환 --- */
function show(id){ for (const x of ['home','lobby','game']) $(x).classList.toggle('hidden', x!==id); if (id==='game') layout(); }
let toastT;
function toast(t, ms=1800){ const el=$('toast'); el.textContent=t; el.classList.remove('hidden'); el.style.opacity=1; clearTimeout(toastT); if (ms===Infinity) return; toastT=setTimeout(hideToast, ms); }
function hideToast(){ const el=$('toast'); clearTimeout(toastT); el.style.opacity=0; toastT=setTimeout(()=>el.classList.add('hidden'),300); }
function overlay(html){ const o=$('overlay'); o.innerHTML=html; o.classList.remove('hidden'); }
function hideOverlay(){ $('overlay').classList.add('hidden'); $('overlay').innerHTML=''; }
function esc(t){ return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* --- 로비 --- */
function shareUrl(code){ return location.origin + location.pathname + '?room=' + code + keepParams(); }
let qrFor = null;
function renderLobby(s){
  $('lobbyCode').textContent = C.solo ? '연습' : s.code;
  $('shareBox').classList.toggle('hidden', C.solo);
  if (!C.solo && qrFor !== s.code && typeof qrcode !== 'undefined'){
    qrFor = s.code;
    try { const q = qrcode(0,'M'); q.addData(shareUrl(s.code)); q.make(); $('qr').innerHTML = q.createSvgTag({cellSize:4, margin:2, scalable:true}); } catch(e){}
  }
  const ul = $('plist'); ul.innerHTML = '';
  s.seats.forEach(p=>{
    const li = document.createElement('li');
    li.innerHTML = `<span class="av" style="background:${p.color}">${p.avatar}</span><span class="nm">${esc(p.name)}${p.id===C.me?' (나)':''}${p.id===s.hostSeat?' 👑':''}</span>`;
    if (C.isHost && p.id!==s.hostSeat){ const b=document.createElement('button'); b.className='x'; b.textContent='✕'; b.onclick=()=>hostRemove(p.id); li.appendChild(b); }
    ul.appendChild(li);
  });
  for (let i=s.seats.length; i<Math.max(4, Math.min(8, s.seats.length+1)); i++){
    const li=document.createElement('li'); li.className='empty'; li.textContent='빈 자리'; ul.appendChild(li);
  }
  $('hostCtl').classList.toggle('hidden', !C.isHost);
  $('waitMsg').classList.toggle('hidden', C.isHost);
  $('hostHint').classList.toggle('hidden', !C.isHost || C.solo);
  const bots = s.seats.filter(p=>p.bot).length;
  $('addBotBtn').disabled = bots >= MAX_BOTS || s.seats.length >= MAX_SEATS;
  $('addBotBtn').textContent = `🤖 AI 팀원 추가 (${bots}/${MAX_BOTS})`;
  $('startBtn').disabled = s.seats.length < 2;
  $('startBtn').textContent = s.seats.length < 2 ? '2명 이상 모이면 시작!' : `${s.seats.length}명으로 게임 시작!`;
}

/* --- 카드 그리기 --- */
const SPOTS = {           // [x, y, 크기]  카드 100x140 기준
  1:[[50,70,76]],
  2:[[50,38,58],[50,102,58]],
  3:[[50,26,46],[50,70,46],[50,114,46]],
  4:[[28,40,48],[72,40,48],[28,100,48],[72,100,48]],
  5:[[27,30,44],[73,30,44],[50,70,44],[27,110,44],[73,110,44]]
};
function cardSVG(c){
  let u = '';
  for (const [x,y,sz] of SPOTS[c.n]) u += `<use href="#f-${c.f}" x="${x-sz/2}" y="${y-sz/2}" width="${sz}" height="${sz}"/>`;
  return `<svg class="card cardsvg" viewBox="0 0 100 140"><rect x="2" y="2" width="96" height="136" rx="13" fill="#fff" stroke="#f1dfcf" stroke-width="3"/>${u}</svg>`;
}

/* --- 게임 화면 --- */
function layout(){
  const wrap = $('arenaWrap');
  const S = Math.max(220, Math.min(wrap.clientWidth, wrap.clientHeight, 600));
  $('arena').style.setProperty('--S', S + 'px');
  if (C.view && C.view.phase!=='lobby') renderGame(C.view);
}
window.addEventListener('resize', layout);
function seatAngles(s){
  const n = s.seats.length, mi = Math.max(0, s.seats.findIndex(p=>p.id===C.me));
  const map = {};
  s.seats.forEach((p,i)=>{ const k = (i - mi + n) % n; map[p.id] = Math.PI/2 + k * 2*Math.PI/n; });
  return map;
}
function renderGame(s){
  const ang = seatAngles(s);
  const seatsEl = $('seats'), pilesEl = $('piles');
  seatsEl.innerHTML = ''; pilesEl.innerHTML = '';
  const me = s.seats.find(p=>p.id===C.me);
  for (const p of s.seats){
    const a = ang[p.id];
    // 카드 더미
    const pr = p.id===C.me ? 0.27 : 0.25;
    const pl = document.createElement('div');
    pl.className = 'pile'; pl.id = 'pile-' + p.id;
    pl.style.left = (50 + pr*100*Math.cos(a)) + '%'; pl.style.top = (50 + pr*100*Math.sin(a)) + '%';
    pl.style.setProperty('--r', ((a - Math.PI/2) * 180/Math.PI) + 'deg');
    pl.innerHTML = p.top ? (p.pileN>1?'<div class="stack"></div>':'') + cardSVG(p.top) : '<div class="slot"></div>';
    pilesEl.appendChild(pl);
    if (p.id===C.me) continue;
    // 다른 플레이어 자리
    const el = document.createElement('div');
    el.className = 'seat' + (s.turn===p.id && s.phase==='play' ? ' turn' : '') + (!p.conn ? ' off' : '');
    el.id = 'seat-' + p.id;
    el.style.left = (50 + 42*Math.cos(a)) + '%'; el.style.top = (50 + 42*Math.sin(a)) + '%';
    el.style.setProperty('--c', p.color);
    const crown = s.phase==='end' && s.winners.includes(p.id) ? '<div class="crown">👑</div>' : '';
    el.innerHTML = `<div class="av">${crown}${p.avatar}<div class="cnt" id="cnt-${p.id}">${p.deckN}</div></div><div class="nm">${esc(p.name)}</div>`;
    seatsEl.appendChild(el);
  }
  // 바닥 카드
  $('pot').classList.toggle('hidden', !s.potN);
  $('pot').textContent = '바닥 ' + s.potN;
  // 내 영역
  if (me){
    $('meAv').textContent = me.avatar; $('meAv').style.background = me.color;
    $('meNm').textContent = me.name;
    document.documentElement.style.setProperty('--myc', me.color);
    const myTurn = s.phase==='play' && s.turn===me.id;
    const deck = $('mydeck');
    deck.classList.toggle('myturn', myTurn);
    deck.classList.toggle('empty', me.deckN===0);
    $('myNum').textContent = me.deckN===0 ? '카드 없음\n벨로 되찾기!' : me.deckN;
    $('speech').classList.toggle('hide', !myTurn);
    let crown = deck.querySelector('.crown');
    const win = s.phase==='end' && s.winners.includes(me.id);
    if (win && !crown){ crown = document.createElement('div'); crown.className='crown'; crown.textContent='👑'; deck.appendChild(crown); }
    if (!win && crown) crown.remove();
  }
  $('gRoom').textContent = C.solo ? 'AI 연습' : '방 ' + s.code;
  $('bell').disabled = s.phase!=='play';
}

/* 타이머 루프 */
function tick(){
  const s = C.view;
  if (s && (s.phase==='play' || s.phase==='end')){
    const hostNow = Date.now() + C.offset;
    const left = s.phase==='end' ? 0 : Math.max(0, s.endsAt - hostNow);
    const sec = Math.ceil(left/1000);
    const t = $('timer'); t.textContent = Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
    t.classList.toggle('hurry', s.phase==='play' && sec <= 30);
    const myTurn = s.phase==='play' && s.turn===C.me && s.turnDeadline;
    $('tbar').style.visibility = myTurn ? 'visible' : 'hidden';
    if (myTurn){ const r = Math.max(0, Math.min(1, (s.turnDeadline - hostNow) / TURN_MS)); $('tbarI').style.transform = `scaleX(${r})`; }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* --- 입력 --- */
let flipLock = 0;
function onDeck(e){
  e.preventDefault();
  const s = C.view; if (!s || s.phase!=='play') return;
  const me = s.seats.find(p=>p.id===C.me);
  if (s.turn!==C.me){ if (me && me.deckN) { $('mydeck').classList.add('shake'); setTimeout(()=>$('mydeck').classList.remove('shake'),450); } return; }
  if (performance.now() < flipLock) return;
  flipLock = performance.now() + 500;
  sfx.flip(); buzz(15);
  sendHost({ t:'flip', ver:s.ver });
}
function onBell(e){
  e.preventDefault();
  const s = C.view; if (!s || s.phase!=='play') return;
  const now = performance.now();
  if (now < C.bellCool) return;
  C.bellCool = now + 350;
  const b = $('bell'); b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring');
  sfx.ding(); buzz(40);
  sendHost({ t:'bell', v:C.lastVer, rt: now - C.shownAt });
}
$('mydeck').addEventListener('pointerdown', onDeck);
$('bell').addEventListener('pointerdown', onBell);

/* --- 애니메이션 --- */
function rectOf(el){ const r = el.getBoundingClientRect(); return { x:r.left + r.width/2, y:r.top + r.height/2, w:r.width, h:r.height }; }
function seatAnchor(id){
  if (id===C.me) return $('mydeck');
  return document.querySelector('#seat-' + id + ' .av') || $('bell');
}
function pileSize(){ const p = document.querySelector('.pile'); if (!p) return {w:50,h:70}; return {w:p.offsetWidth, h:p.offsetHeight}; }
function flyEl(html, from, to, dur, delay=0, w, h, rot=0){
  return new Promise(res=>{
    const d = document.createElement('div'); d.className='fly'; d.innerHTML = html;
    d.style.width = w+'px'; d.style.height = h+'px';
    document.body.appendChild(d);
    const a = d.animate([
      { transform:`translate(${from.x-w/2}px,${from.y-h/2}px) scale(${from.s||1}) rotate(0deg)` },
      { transform:`translate(${to.x-w/2}px,${to.y-h/2}px) scale(${to.s||1}) rotate(${rot}deg)` }
    ], { duration:dur, delay, easing:'cubic-bezier(.3,.8,.3,1)', fill:'forwards' });
    a.onfinish = ()=>{ d.remove(); res(); };
    setTimeout(()=>{ if (d.isConnected){ d.remove(); res(); } }, dur + delay + 400);
  });
}
function floatText(txt, at, cls){
  const f = document.createElement('div'); f.className = 'float ' + cls; f.textContent = txt;
  f.style.left = at.x + 'px'; f.style.top = at.y + 'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(), 1100);
}
const BACK = '<div class="bk"></div>';
async function animate(ev, s){
  if ($('game').classList.contains('hidden') && ev.type!=='deal') return;
  if (ev.type==='deal'){
    show('game'); hideOverlay(); C.view = s; C.lastVer = s.ver; renderGame(s);
    const {w,h} = pileSize(); const c = rectOf($('bell'));
    const ps = [];
    s.seats.forEach((p,i)=>{ const to = rectOf(seatAnchor(p.id)); for (let k=0;k<3;k++) ps.push(flyEl(BACK, c, to, 450, i*60 + k*90, w, h, 200)); });
    sfx.shuffle();
    await Promise.all(ps);
    return;
  }
  if (ev.type==='flip'){
    hideToast(); // 멘트는 다음 사람이 카드를 낼 때까지 유지
    const p = s.seats.find(x=>x.id===ev.seat);
    const src = seatAnchor(ev.seat), dst = $('pile-' + ev.seat);
    if (!src || !dst || !p) return;
    if (ev.seat!==C.me) sfx.flip();
    const {w,h} = pileSize();
    const from = rectOf(src); from.s = .6; const to = rectOf(dst);
    await flyEl(cardSVG(ev.card), from, to, 260, 0, w, h);
    return;
  }
  if (ev.type==='collect'){
    const {w,h} = pileSize();
    const dstEl = seatAnchor(ev.seat), to = rectOf(dstEl); to.s = .5;
    const ps = []; let k = 0;
    for (const id of ev.from){
      const pe = $('pile-' + id); if (!pe) continue;
      const from = rectOf(pe);
      pe.style.visibility = 'hidden';
      ps.push(flyEl(BACK, from, to, 480, k++*45, w, h, 180));
    }
    if (ev.potN){ $('pot').classList.add('hidden'); ps.push(flyEl(BACK, rectOf($('bell')), to, 480, k++*45, w, h, -180)); }
    const b=$('bell'); b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring');
    if (ev.seat===C.me){ sfx.win(); buzz([30,40,30]); } else sfx.ding(.6);
    await Promise.all(ps);
    floatText('+' + ev.n, rectOf(dstEl), 'plus');
    const p = s.seats.find(x=>x.id===ev.seat);
    if (p) toast((ev.seat===C.me ? '내가' : p.name + ' 님이') + ' 땡! 카드 ' + ev.n + '장 획득 🎉', Infinity);
    return;
  }
  if (ev.type==='mistake'){
    const srcEl = seatAnchor(ev.seat); if (!srcEl) return;
    const box = ev.seat===C.me ? $('mydeck') : document.querySelector('#seat-' + ev.seat);
    if (box){ box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
    sfx.buzz(); if (ev.seat===C.me) buzz(120);
    floatText(ev.lost ? '-1' : '삐빅!', rectOf(srcEl), 'minus');
    if (ev.lost){ const {w,h} = pileSize(); await flyEl(BACK, rectOf(srcEl), rectOf($('bell')), 380, 0, w, h, 90); }
    const p = s.seats.find(x=>x.id===ev.seat);
    if (p) toast((ev.seat===C.me ? '앗, 실수! 카드 1장이 바닥으로' : p.name + ' 님 실수! 카드 1장이 바닥으로'), Infinity);
    return;
  }
}

/* --- 끝 화면 --- */
function showEnd(s){
  if (C.ended) return; C.ended = true; hideToast();
  const rank = s.seats.slice().sort((a,b)=>b.deckN-a.deckN);
  const champs = rank.filter(p=>s.winners.includes(p.id));
  const meWin = s.winners.includes(C.me);
  sfx.fanfare(); confetti();
  let place = 0, last = -1;
  const rows = rank.map((p,i)=>{ if (p.deckN!==last){ place = i+1; last = p.deckN; }
    return `<li class="${s.winners.includes(p.id)?'w':''}"><span class="r">${s.winners.includes(p.id)?'👑':place}</span><span class="av" style="background:${p.color}">${p.avatar}</span>${esc(p.name)}${p.id===C.me?' (나)':''}<span class="n">${p.deckN}장</span></li>`; }).join('');
  setTimeout(()=>{
    overlay(`<div class="endcard">
      <div class="trophy">🏆</div>
      <h2>${meWin ? '내가 챔피언!' : '게임 끝!'}</h2>
      <div class="champ">${champs.map(p=>esc(p.name)).join(', ')} ${champs.length>1?'공동 ':''}챔피언 👑</div>
      <ul class="rank">${rows}</ul>
      ${C.isHost ? '<button class="btn" id="againBtn">한 판 더!</button>' : '<div class="hint">방장이 다음 판을 열면 자동으로 이어져요</div>'}
      <button class="btn ghost" id="closeEnd">닫기</button>
    </div>`);
    const a = $('againBtn'); if (a) a.onclick = ()=>{ hideOverlay(); hostAgain(); };
    $('closeEnd').onclick = ()=>{ hideOverlay(); toast('위쪽 시계를 누르면 결과를 다시 볼 수 있어요'); };
  }, 600);
}
$('timer').addEventListener('click', ()=>{ if (C.view && C.view.phase==='end'){ C.ended=false; showEnd(C.view); } });
function confetti(){
  const cols = ['#ff8fab','#ffc857','#6fd6c6','#c3a6ff','#9bd77c','#7fc8f8'];
  for (let i=0;i<60;i++){
    const c = document.createElement('div'); c.className='confetti';
    c.style.left = Math.random()*100 + 'vw'; c.style.background = cols[i%cols.length];
    c.style.animationDuration = rand(1.8,3.2) + 's'; c.style.animationDelay = rand(0,.6) + 's';
    document.body.appendChild(c); setTimeout(()=>c.remove(), 4200);
  }
}

/* --- 소리 --- */
let AC = null;
function ac(){ if (!AC) { try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return null; } } if (AC.state==='suspended') AC.resume(); return AC; }
function tone(f, dur, type='sine', vol=.2, when=0){
  if (!C.sound) return; const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
function noise(dur, vol=.15, when=0, freq=1800){
  if (!C.sound) return; const a = ac(); if (!a) return;
  const t = a.currentTime + when, len = Math.floor(a.sampleRate*dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = a.createBufferSource(); src.buffer = buf;
  const flt = a.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value=freq;
  const g = a.createGain(); g.gain.value = vol;
  src.connect(flt).connect(g).connect(a.destination); src.start(t);
}
const sfx = {
  ding(v=1){ tone(1760,1.1,'sine',.22*v); tone(3520,.6,'sine',.06*v); tone(2637,.8,'triangle',.05*v); },
  flip(){ noise(.07,.25,0,2400); },
  shuffle(){ for (let i=0;i<6;i++) noise(.05,.18,i*.07,2000); },
  win(){ [784,988,1175,1568].forEach((f,i)=>tone(f,.25,'triangle',.16,i*.07)); },
  buzz(){ tone(150,.28,'square',.07); tone(110,.3,'square',.05,.06); },
  fanfare(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.15,i*.12)); },
};
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
$('sndBtn').onclick = ()=>{ C.sound = !C.sound; $('sndBtn').textContent = C.sound ? '🔊' : '🔇'; };

/* --- 화면 꺼짐 방지 --- */
let wakeLock = null;
async function requestWake(){ try { if ('wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock=null; }); } } catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden && C.view && C.view.phase==='play') requestWake(); });

/* --- 홈 버튼 --- */
function getName(){
  const n = $('nameIn').value.trim();
  if (!n){ $('homeMsg').textContent = '이름을 먼저 적어 주세요'; $('nameIn').focus(); return null; }
  try { localStorage.setItem('hg-name', n); } catch(e){}
  ac();
  return n;
}
$('createBtn').onclick = ()=>{ const n = getName(); if (n) openRoom(n, false); };
$('soloBtn').onclick = ()=>{ const n = getName(); if (n) openRoom(n, true); };
$('joinBtn').onclick = ()=>{
  const n = getName(); if (!n) return;
  const code = $('codeIn').value.trim();
  if (!/^[0-9]{4}$/.test(code)){ $('homeMsg').textContent = '방 코드 숫자 4자리를 적어 주세요'; return; }
  joinRoom(n, code);
};
$('codeIn').addEventListener('input', e=>{ e.target.value = e.target.value.replace(/[^0-9]/g,'').slice(0,4); });
$('addBotBtn').onclick = ()=>hostAddBot();
$('startBtn').onclick = ()=>{ ac(); hostStart(); };
$('copyBtn').onclick = async ()=>{ try { await navigator.clipboard.writeText(shareUrl(C.view.code)); toast('링크를 복사했어요'); } catch(e){ toast(shareUrl(C.view.code), 4000); } };
$('shareBtn').onclick = async ()=>{
  const url = shareUrl(C.view.code);
  if (navigator.share){ try { await navigator.share({ title:'할리갈리 하자!', text:'방 코드 ' + C.view.code, url }); } catch(e){} }
  else { try { await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); } catch(e){ toast(url, 4000); } }
};
window.addEventListener('beforeunload', (e)=>{ if (C.isHost && !C.solo && H.S && H.S.seats.length > 1){ e.preventDefault(); e.returnValue=''; } });

(function boot(){
  try { const n = localStorage.getItem('hg-name'); if (n) $('nameIn').value = n; } catch(e){}
  const r = (qs.get('room')||'').trim();
  if (/^[0-9]{4}$/.test(r)){
    $('codeIn').value = r;
    $('createBtn').classList.add('hidden'); $('soloBtn').classList.add('hidden');
    document.querySelector('.or').classList.add('hidden');
    $('joinBtn').textContent = '입장';
    if (!$('nameIn').value) $('nameIn').focus();
  }
  // 테스트 훅
  window.__hg = { H, C };
})();
</script>
